<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE CALCULATOR</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="auth-container">
        <div id="login-form" class="auth-form">
            <h2>Login</h2>
            <div class="form-group">
                <label for="login-username">Username</label>
                <input type="text" id="login-username" placeholder="Enter username">
            </div>
            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" placeholder="Enter password">
            </div>
            <button onclick="login()">Login</button>
            <p>Don't have an account? <a href="#" onclick="toggleAuthForms()">Register</a></p>
            <div id="login-message" class="message"></div>
        </div>

        <div id="register-form" class="auth-form hidden">
            <h2>Register</h2>
            <div class="form-group">
                <label for="register-username">Username</label>
                <input type="text" id="register-username" placeholder="Choose username">
            </div>
            <div class="form-group">
                <label for="register-password">Password</label>
                <input type="password" id="register-password" placeholder="Choose password">
            </div>
            <div class="form-group">
                <label for="register-confirm">Confirm Password</label>
                <input type="password" id="register-confirm" placeholder="Confirm password">
            </div>
            <button onclick="register()">Register</button>
            <p>Already have an account? <a href="#" onclick="toggleAuthForms()">Login</a></p>
            <div id="register-message" class="message"></div>
        </div>
    </div>

    <div id="main-container" class="hidden">
        <div id="user-panel">
            <span id="welcome-message">Welcome, User!</span>
            <button id="logout-btn" onclick="logout()">Logout</button>
        </div>

        <div id="Calculator">
            <input id="display" readonly>
            
            <div class="mode-toggle">
                <button id="basicModeBtn" class="mode-btn active" onclick="switchMode('basic')">Basic</button>
                <button id="scientificModeBtn" class="mode-btn" onclick="switchMode('scientific')">Scientific</button>
                <button id="historyBtn" class="mode-btn" onclick="toggleHistory()">History</button>
            </div>
            <div class="clear-group">
                <button onclick="clearDisplay()" class="opbtn">C</button>
                <button onclick="backspace()" class="backspace-btn">⌫</button>
            </div>

            <div id="basicKeys" class="keys-container active">
                <div class="button-grid">
                    <button onclick="appendToDisplay('7')">7</button>
                    <button onclick="appendToDisplay('8')">8</button>
                    <button onclick="appendToDisplay('9')">9</button>
                    <button onclick="appendToDisplay('+')" class="opbtn">+</button>
                    
                    <button onclick="appendToDisplay('4')">4</button>
                    <button onclick="appendToDisplay('5')">5</button>
                    <button onclick="appendToDisplay('6')">6</button>
                    <button onclick="appendToDisplay('-')" class="opbtn">-</button>
                    
                    <button onclick="appendToDisplay('1')">1</button>
                    <button onclick="appendToDisplay('2')">2</button>
                    <button onclick="appendToDisplay('3')">3</button>
                    <button onclick="appendToDisplay('*')" class="opbtn">×</button>
                    
                    <button onclick="appendToDisplay('0')">0</button>
                    <button onclick="appendToDisplay('.')">.</button>
                    <button onclick="appendToDisplay('/')" class="opbtn" style="grid-column: span 2;">÷</button>
                    
                    <button onclick="calculate()" id="equalsBtn" style="grid-column: span 4;">=</button>
                </div>
            </div>

            <div id="scientificKeys" class="keys-container">
                <div class="scientific-sections">
                    <div class="scientific-row">
                        <button onclick="appendToDisplay('x')" class="var-btn">x</button>
                        <button onclick="appendToDisplay('(')" class="var-btn">(</button>
                        <button onclick="appendToDisplay(')')" class="var-btn">)</button>
                        <button onclick="appendToDisplay('**')" class="var-btn">x^y</button>
                    </div>
                    
                    <div class="scientific-row">
                        <button onclick="calculateSimpleFunction('sqrt')" class="func-btn">√</button>
                        <button onclick="calculateSimpleFunction('sin')" class="func-btn">sin</button>
                        <button onclick="calculateSimpleFunction('cos')" class="func-btn">cos</button>
                        <button onclick="calculateSimpleFunction('tan')" class="func-btn">tan</button>
                    </div>
                    
                    <div class="scientific-row">
                        <button onclick="calculateSimpleFunction('log')" class="func-btn">log</button>
                        <button onclick="calculateSimpleFunction('ln')" class="func-btn">ln</button>
                        <button onclick="appendToDisplay('pi')" class="func-btn">π</button>
                        <button onclick="appendToDisplay('e')" class="func-btn">e</button>
                    </div>
                    
                    <div class="scientific-row">
                        <button onclick="showLimitInput()" class="sci-btn">lim</button>
                        <button onclick="calculateScientific('derivative')" class="sci-btn">d/dx</button>
                        <button onclick="calculateScientific('integral')" class="sci-btn">∫</button>
                        <button onclick="calculateScientific('solve')" class="sci-btn">eq</button>
                    </div>
                </div>
                
                <div class="button-grid">
                    <button onclick="appendToDisplay('7')">7</button>
                    <button onclick="appendToDisplay('8')">8</button>
                    <button onclick="appendToDisplay('9')">9</button>
                    <button onclick="appendToDisplay('+')" class="opbtn">+</button>
                    
                    <button onclick="appendToDisplay('4')">4</button>
                    <button onclick="appendToDisplay('5')">5</button>
                    <button onclick="appendToDisplay('6')">6</button>
                    <button onclick="appendToDisplay('-')" class="opbtn">-</button>
                    
                    <button onclick="appendToDisplay('1')">1</button>
                    <button onclick="appendToDisplay('2')">2</button>
                    <button onclick="appendToDisplay('3')">3</button>
                    <button onclick="appendToDisplay('*')" class="opbtn">×</button>
                    
                    <button onclick="appendToDisplay('0')">0</button>
                    <button onclick="appendToDisplay('.')">.</button>
                    <button onclick="appendToDisplay('=')" >=</button>
                    <button onclick="appendToDisplay('/')" class="opbtn">÷</button>
                </div>
            </div>
        </div>
        
        <div id="history-panel" class="hidden">
            <h3>Calculation History</h3>
            <ul id="history-list">
                
            </ul>
            <button onclick="toggleHistory()" class="close-history">Close History</button>
        </div>
        
        <div id="limitModal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="closeModal()">&times;</span>
                <h3>Limit Value</h3>
                <p>Enter the value of x you want to approach:</p>
                <input type="number" id="limitValue" placeholder="Enter value...">
                <button onclick="calculateLimit()">Calculate</button>
            </div>
        </div>
    </div>
    <script src="auth.js"></script>
    <script src="index.js"></script>
</body>
</html>
